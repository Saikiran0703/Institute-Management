<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Instructors</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Instructor List</h2>
    <a class="btn btn-success mb-3" href="/instructors/add">Add Instructor</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th><th>Email</th><th>Specialization</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="instructor : ${instructors}">
            <td th:text="${instructor.name}">Name</td>
            <td th:text="${instructor.email}">Email</td>
            <td th:text="${instructor.specialization}">Specialization</td>
            <td>
                <a th:href="@{'/instructors/edit/' + ${instructor.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/instructors/delete/' + ${instructor.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
