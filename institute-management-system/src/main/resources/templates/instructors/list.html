<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Instructors</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Manage Instructors</h2>

    <div th:if="${successMessage}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="mb-3">
        <a th:href="@{/instructors/new}" class="btn btn-primary"><i class="fas fa-plus"></i> Add Instructor</a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Specialization</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="instructor : ${instructors}">
            <td th:text="${instructor.id}"></td>
            <td th:text="${instructor.name}"></td>
            <td th:text="${instructor.email}"></td>
            <td th:text="${instructor.specialization}"></td>
            <td>
                <a th:href="@{/instructors/edit/{id}(id=${instructor.id})}" class="btn btn-sm btn-info"><i class="fas fa-edit"></i> Edit</a>
                <a th:href="@{/instructors/delete/{id}(id=${instructor.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this instructor?')"><i class="fas fa-trash"></i> Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    </div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
