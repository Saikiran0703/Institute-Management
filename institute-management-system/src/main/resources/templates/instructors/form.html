<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Instructor</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${instructor.id == 0 ? 'Add Instructor' : 'Edit Instructor'}"></h2>
    <form th:action="@{/instructors/save}" th:object="${instructor}" method="post">
        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Specialization</label>
            <input type="text" th:field="*{specialization}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary mt-3">Save</button>
        <a href="/instructors" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
</body>
</html>
