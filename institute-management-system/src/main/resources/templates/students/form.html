<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Student</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${student.id == 0 ? 'Add Student' : 'Edit Student'}"></h2>
    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" th:field="*{phone}" class="form-control">
        </div>
        <div class="form-group">
            <label>Enrollment Date</label>
            <input type="date" th:field="*{enrollmentDate}" class="form-control">
        </div>
        <div class="form-group">
            <label>Course</label>
            <select th:field="*{course}" class="form-control" required>
                <option th:each="course : ${courses}" th:value="${course}" th:text="${course.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Save</button>
        <a href="/students" class="btn btn-secondary mt-3">Cancel</a>
    </form>
</div>
</body>
</html>
