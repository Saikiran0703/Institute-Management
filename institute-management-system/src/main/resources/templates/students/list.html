<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Student List</h2>
    <a class="btn btn-success mb-3" href="/students/add">Add Student</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.name}">Name</td>
            <td th:text="${student.email}">Email</td>
            <td th:text="${student.phone}">Phone</td>
            <td th:text="${student.course.name}">Course</td>
            <td>
                <a th:href="@{'/students/edit/' + ${student.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/students/delete/' + ${student.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
