<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Students</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Manage Students</h2>

    <div th:if="${successMessage}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="mb-3">
        <a th:href="@{/students/new}" class="btn btn-primary"><i class="fas fa-plus"></i> Add Student</a>
    </div>

    <form th:action="@{/students/search}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" class="form-control" name="query" th:value="${searchQuery}"
                   placeholder="Search by name or course">
            <select class="form-control" name="searchBy">
                <option value="name" th:selected="${searchBy == 'name'}">Name</option>
                <option value="course" th:selected="${searchBy == 'course'}">Course</option>
            </select>
            <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="submit"><i class="fas fa-search"></i> Search</button>
            </div>
            <div class="input-group-append">
                <a th:href="@{/students}" class="btn btn-outline-secondary"><i class="fas fa-undo"></i> Reset</a>
            </div>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Enrollment Date</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.phone}"></td>
            <td th:text="${student.enrollmentDate}"></td>
            <td th:text="${student.course != null ? student.course.name : '-'}"></td>
            <td>
                <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-info"><i class="fas fa-edit"></i> Edit</a>
                <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this student?')"><i class="fas fa-trash"></i> Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}">
        <nav aria-label="Student Pagination">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:if="${currentPage > 0}">
                    <a class="page-link" th:href="@{/students(page=${currentPage - 1}, size=${#request.getParameter('size')})}">Previous</a>
                </li>
                <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                    th:class="${currentPage == pageNumber - 1} ? 'page-item active' : 'page-item'">
                    <a class="page-link" th:href="@{/students(page=${pageNumber - 1}, size=${#request.getParameter('size')})}"
                       th:text="${pageNumber}"></a>
                </li>
                <li class="page-item" th:if="${currentPage < totalPages - 1}">
                    <a class="page-link" th:href="@{/students(page=${currentPage + 1}, size=${#request.getParameter('size')})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
