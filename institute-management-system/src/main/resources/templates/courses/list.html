<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Courses</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Manage Courses</h2>

    <div th:if="${successMessage}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
    </div>

    <div class="mb-3">
        <a th:href="@{/courses/new}" class="btn btn-primary"><i class="fas fa-plus"></i> Add Course</a>
    </div>

    <form th:action="@{/courses/search}" method="get" class="mb-3">
        <div class="input-group">
            <input type="text" class="form-control" name="instructorName" th:value="${searchInstructorName}"
                   placeholder="Search by instructor name">
            <div class="input-group-append">
                <button class="btn btn-outline-secondary" type="submit"><i class="fas fa-search"></i> Search</button>
            </div>
            <div class="input-group-append">
                <a th:href="@{/courses}" class="btn btn-outline-secondary"><i class="fas fa-undo"></i> Reset</a>
            </div>
        </div>
    </form>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Duration</th>
            <th>Instructor</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.id}"></td>
            <td th:text="${course.name}"></td>
            <td th:text="${course.description}"></td>
            <td th:text="${course.duration}"></td>
            <td th:text="${course.instructor != null ? course.instructor.name : '-'}"></td>
            <td>
                <a th:href="@{/courses/edit/{id}(id=${course.id})}" class="btn btn-sm btn-info"><i class="fas fa-edit"></i> Edit</a>
                <a th:href="@{/courses/delete/{id}(id=${course.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this course?')"><i class="fas fa-trash"></i> Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}">
        <nav aria-label="Course Pagination">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:if="${currentPage > 0}">
                    <a class="page-link" th:href="@{/courses(page=${currentPage - 1}, size=${#request.getParameter('size'))}}">Previous</a>
                </li>
                <li class="page-item" th:each="pageNumber : ${pageNumbers}"
                    th:class="${currentPage == pageNumber - 1} ? 'page-item active' : 'page-item'">
                    <a class="page-link" th:href="@{/courses(page=${pageNumber - 1}, size=${#request.getParameter('size'))}}"
                       th:text="${pageNumber}"></a>
                </li>
                <li class="page-item" th:if="${currentPage < totalPages - 1}">
                    <a class="page-link" th:href="@{/courses(page=${currentPage + 1}, size=${#request.getParameter('size'))}}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
