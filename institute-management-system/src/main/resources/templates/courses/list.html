<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Course List</h2>
    <a class="btn btn-success mb-3" href="/courses/add">Add Course</a>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th><th>Description</th><th>Duration</th><th>Instructor</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.name}">Name</td>
            <td th:text="${course.description}">Description</td>
            <td th:text="${course.duration}">Duration</td>
            <td th:text="${course.instructor.name}">Instructor</td>
            <td>
                <a th:href="@{'/courses/edit/' + ${course.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/courses/delete/' + ${course.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
