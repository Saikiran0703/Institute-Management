<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Courses List</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Courses</h2>
    <a class="btn btn-success mb-3" href="/courses/add">Add Course</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Duration</th>
            <th>Instructor</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.name}">Course Name</td>
            <td th:text="${course.description}">Description</td>
            <td th:text="${course.duration}">Duration</td>
			<td>
			    <span th:if="${course.instructor != null}" th:text="${course.instructor.name}">Instructor Name</span>
			    <span th:unless="${course.instructor != null}">N/A</span>
			</td>


            <td>
                <a th:href="@{'/courses/edit/' + ${course.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/courses/delete/' + ${course.id}}" class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this course?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
